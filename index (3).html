
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شغل الدقهلية | منصة الوظائف الحقيقية</title>
<style>
:root{--green:#123c35;--mint:#e8f3ee;--gold:#e8b85a}
*{box-sizing:border-box}
body{margin:0;background:#f4f7f5;font-family:Arial,sans-serif;color:#19332d}
header{background:var(--green);color:white;padding:22px 16px;border-bottom:4px solid var(--gold)}
header h1{margin:0 0 8px;font-size:25px}
header p{margin:0;color:var(--mint)}
main{max-width:750px;margin:auto;padding:16px}
.panel{background:white;border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 3px 12px #123c3510}
h2{font-size:19px;margin-top:0}
input,select,textarea,button{width:100%;padding:12px;margin:6px 0;border-radius:9px;border:1px solid #d5e1da;font:inherit}
button{background:var(--green);color:white;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.job{border:1px solid #dce8e1;border-radius:12px;padding:14px;margin:12px 0}
.job h3{margin:0 0 8px;color:var(--green)}
.meta{color:#62766c;font-size:14px;line-height:1.9}
.apply{display:block;text-align:center;background:#16834a;color:white;padding:12px;border-radius:9px;text-decoration:none;margin-top:10px}
small{color:#62766c;line-height:1.8}
#status{line-height:1.8}
</style>
</head>
<body>
<header>
<h1>شغل الدقهلية 💚</h1>
<p>منصة الوظائف الحقيقية — فرص عمل قريبة منك</p>
</header>

<main>
<section class="panel">
<h2>🔎 دور على شغل</h2>
<input id="search" placeholder="اكتب اسم الوظيفة أو المكان">
<select id="filter">
<option value="">كل المناطق</option>
<option>المنصورة</option>
<option>أويش الحجر</option>
<option>البدالة</option>
<option>البرامون</option>
<option>البقلية</option>
<option>برق العز</option>
<option>بدواي</option>
<option>شها</option>
<option>طناح</option>
<option>ميت بدر خميس</option>
<option>ميت مزاح</option>
<option>محلة الدمنة</option>
</select>
</section>

<section class="panel">
<h2>➕ انشر فرصة عمل</h2>
<form id="jobForm">
<input id="title" placeholder="اسم الوظيفة" maxlength="100" required>
<input id="company" placeholder="اسم المحل أو الشركة" maxlength="100">
<select id="area" required>
<option value="">اختار المنطقة</option>
<option>المنصورة</option>
<option>أويش الحجر</option>
<option>البدالة</option>
<option>البرامون</option>
<option>البقلية</option>
<option>برق العز</option>
<option>بدواي</option>
<option>شها</option>
<option>طناح</option>
<option>ميت بدر خميس</option>
<option>ميت مزاح</option>
<option>محلة الدمنة</option>
</select>
<input id="salary" placeholder="المرتب (اختياري)">
<textarea id="details" placeholder="تفاصيل الشغل ومواعيد العمل" maxlength="1500"></textarea>
<input id="phone" type="tel" placeholder="رقم واتساب صاحب الوظيفة" maxlength="20" required>
<button id="submitBtn" type="submit">إرسال للمراجعة</button>
</form>
<p id="status" role="status">جاري الاتصال بالخدمة...</p>
<small>الوظيفة مش هتظهر للناس إلا بعد مراجعتها والموافقة عليها.</small>
</section>

<section class="panel">
<h2>💼 الوظائف المعتمدة</h2>
<div id="jobs">جاري تحميل الوظائف...</div>
</section>
</main>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
getFirestore,collection,addDoc,onSnapshot,query,where,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

import {
getAuth,signInAnonymously
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyAx1gcyth1EFOCV2z4peE3nP7F5d2IHDOc",
authDomain: "hoghl-dakahlia.firebaseapp.com",
projectId: "hoghl-dakahlia",
storageBucket: "hoghl-dakahlia.firebasestorage.app",
messagingSenderId: "437958970783",
appId: "1:437958970783:web:0399059a90cec0e0aa01aa",
measurementId: "G-2ZKG5V6ESQ"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const $ = id => document.getElementById(id);
let jobs = [];

function showStatus(message, error=false) {
  $("status").textContent = message;
  $("status").style.color = error ? "#b42318" : "#19332d";
}

function render() {
  const search = $("search").value.trim().toLowerCase();
  const area = $("filter").value;
  const list = jobs.filter(job =>
    (!area || job.area === area) &&
    [job.title,job.company,job.area,job.details,job.salary]
      .join(" ").toLowerCase().includes(search)
  );

  $("jobs").replaceChildren();

  if (!list.length) {
    $("jobs").textContent = "مفيش وظائف معتمدة مطابقة دلوقتي.";
    return;
  }

  list.forEach(job => {
    const card = document.createElement("article");
    card.className = "job";

    const title = document.createElement("h3");
    title.textContent = job.title || "وظيفة";
    card.appendChild(title);

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent =
      "📍 " + (job.area || "غير محدد") +
      " | " + (job.company || "جهة العمل غير محددة") +
      (job.salary ? " | 💰 " + job.salary : "");
    card.appendChild(meta);

    if (job.details) {
      const details = document.createElement("p");
      details.textContent = job.details;
      card.appendChild(details);
    }

    const link = document.createElement("a");
    link.className = "apply";
    link.textContent = "التقديم عبر واتساب";

    let phone = String(job.phone || "").replace(/\D/g,"");
    if (phone.startsWith("00")) phone = phone.substring(2);
    if (phone.startsWith("0")) phone = "20" + phone.substring(1);

    link.href = "https://wa.me/" + phone;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    card.appendChild(link);

    $("jobs").appendChild(card);
  });
}

$("jobForm").addEventListener("submit", async event => {
  event.preventDefault();

  const btn = $("submitBtn");
  btn.disabled = true;
  btn.textContent = "جاري الإرسال...";

  try {
    const title = $("title").value.trim();
    const company = $("company").value.trim();
    const area = $("area").value;
    const salary = $("salary").value.trim();
    const details = $("details").value.trim();
    const phone = $("phone").value.replace(/\D/g,"");

    if (phone.length < 10 || phone.length > 15) {
      showStatus("اكتب رقم واتساب صحيحًا.", true);
      return;
    }

    if (!auth.currentUser) {
      await signInAnonymously(auth);
    }

    await addDoc(collection(db, "jobs"), {
      title,
      company,
      area,
      salary,
      details,
      phone,
      status: "pending",
      createdAt: serverTimestamp()
    });

    $("jobForm").reset();
    showStatus("تم إرسال الوظيفة للمراجعة. هتظهر بعد الموافقة ❤️");

  } catch (error) {
    console.error(error);
    showStatus(
      "الإرسال لم ينجح. تأكد من إعدادات Firebase وقواعد Firestore.",
      true
    );
  } finally {
    btn.disabled = false;
    btn.textContent = "إرسال للمراجعة";
  }
});

$("search").addEventListener("input",render);
$("filter").addEventListener("change",render);

const approvedQuery = query(
  collection(db, "jobs"),
  where("status", "==", "approved")
);

onSnapshot(approvedQuery, snapshot => {
  jobs = snapshot.docs.map(item => ({
    id: item.id,
    ...item.data()
  }));

  jobs.sort((a,b) => {
    const timeA = a.createdAt?.toMillis?.() || 0;
    const timeB = b.createdAt?.toMillis?.() || 0;
    return timeB - timeA;
  });

  render();
}, error => {
  console.error(error);
  $("jobs").textContent = "تعذر تحميل الوظائف. راجع إعدادات Firebase.";
});

showStatus("جاهز لاستقبال الوظائف.");
</script>
</body>
</html>
